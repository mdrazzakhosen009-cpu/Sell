<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SAREE Admin Panel</title><link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div id="login" class="login-screen">
  <div class="loginBox">
    <div class="loginLogo"><svg class="adminSareeLogo" viewBox="0 0 330 150" aria-label="SAREE Premium Collection"><g fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M165 7c-13 22-39 30-39 53 0 16 13 27 39 27s39-11 39-27c0-23-26-31-39-53Z"/><path d="M165 29c-16 12-23 23-23 38"/><path d="M125 57c-34 4-51 20-64 42 25-9 47-8 72 4"/><path d="M205 57c34 4 51 20 64 42-25-9-47-8-72 4"/><path d="M105 105c-33 2-59 11-85 29 38-1 69-8 99-22"/><path d="M225 105c33 2 59 11 85 29-38-1-69-8-99-22"/><path d="M74 136h182"/></g><text x="165" y="111" text-anchor="middle" fill="currentColor" font-family="Georgia,serif" font-size="53" letter-spacing="10">SAREE</text><text x="165" y="130" text-anchor="middle" fill="currentColor" font-family="Arial,sans-serif" font-size="8" letter-spacing="4">PREMIUM COLLECTION</text></svg></div>
    <small>ADMIN PANEL</small><h1>Welcome back</h1><p class="loginSub">Sign in to manage your SAREE store</p>
    <input id="password" type="password" placeholder="Admin password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    <button class="loginBtn" onclick="login()">LOGIN</button><p id="loginError" class="error"></p>
  </div>
</div>

<div id="panel" class="hidden admin-shell">
  <div id="sidebarOverlay" class="sidebarOverlay" onclick="closeSidebar()"></div>
  <aside id="sidebar" class="sidebar">
    <div class="brand"><svg class="adminSareeLogo" viewBox="0 0 300 120" aria-label="SAREE"><g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M150 8c-9 18-28 24-28 43 0 11 9 19 28 19s28-8 28-19c0-19-19-25-28-43Z"/><path d="M150 30c-11 9-17 17-17 28"/><path d="M122 51c-27 3-39 17-49 33 18-7 36-7 55 2"/><path d="M178 51c27 3 39 17 49 33-18-7-36-7-55 2"/><path d="M104 84c-24 2-43 9-63 22 28-1 52-6 75-16"/><path d="M196 84c24 2 43 9 63 22-28-1-52-6-75-16"/><path d="M75 109h150"/></g><text x="150" y="103" text-anchor="middle" fill="currentColor" font-family="Georgia,serif" font-size="44" letter-spacing="8">SAREE</text></svg></div>
    <div class="adminLabel">ADMIN PANEL</div>
    <nav class="nav">
      <button data-view="dashboard" onclick="show('dashboard')"><span>⌂</span> Dashboard</button>
      <button data-view="products" onclick="show('products')"><span>▣</span> Products</button>
      <button data-view="orders" onclick="show('orders')"><span>🛒</span> Orders</button>
      <button data-view="agents" onclick="show('agents')"><span>♙</span> Agents</button>
      <button data-view="customers" onclick="show('customers')"><span>♧</span> Customers</button>
      <button data-view="catalog" onclick="show('catalog')"><span>⌕</span> Catalog Search</button>
      <button data-view="settings" onclick="show('settings')"><span>⚙</span> Website Settings</button>
      <button data-view="payments" onclick="show('payments')"><span>৳</span> Payment Settings</button>
      <button data-view="chatbot" onclick="show('chatbot')"><span>✦</span> AI Chatbot</button>
      <button data-view="security" onclick="show('security')"><span>🔒</span> Profile & Security</button>
    </nav>
    <div class="sidebarBottom"><a href="/" target="_blank">↗ Open Store</a><button class="logoutBtn" onclick="logout()">⇥ Logout</button></div>
  </aside>
  <main class="main">
    <header class="topbar"><button class="menuBtn" onclick="toggleSidebar()">☰</button><div><strong>SAREE</strong><span>Admin Dashboard</span></div><a href="/" target="_blank" class="storeLink">View Store ↗</a></header>
    <section id="view" class="content"></section>
  </main>
</div>
<script src="/admin/admin.js"></script>
</body></html>
